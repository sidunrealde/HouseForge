; HouseForge's own shipped defaults.
;
; This file is a real, honoured layer of UE's plugin config hierarchy: FPluginManager registers
; every mounted plugin with FConfigCacheIni, and {PLUGIN}/Config/Default<PluginName>.ini is read
; before {PROJECT}/Config/Default<PluginName>.ini. So HouseForge ships and versions its defaults
; alongside its code, inside its own git repository, which is what .claude/rules/01-scope.md wants.
;
; It is deliberately EMPTY of values. Every figure's default already lives in UHFSettings as a C++
; initialiser, and stating them a second time here would create two sources of truth that could
; disagree - with the ini silently winning. The file exists to declare the section and to be the
; place a project-wide default is put if one is ever wanted, not to duplicate the header.
;
; Values a user changes in Project Settings do NOT land here. `defaultconfig` sends the editor's
; writes to {PROJECT}/Config/DefaultHouseForge.ini, which is the user's project and the user's
; choice. Nothing HouseForge does writes to DefaultEngine.ini or DefaultGame.ini.

[/Script/HouseForge.HFSettings]
